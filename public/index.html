<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unísono</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #131320;
    color: #F2F2F7;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    height: 100%;
  }
  .contenedor {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 24px;
    box-sizing: border-box;
  }
  .logo {
    width: 64px;
    height: 64px;
    border-radius: 18px;
    background: #6C63FF;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    margin-bottom: 24px;
  }
  .barra {
    width: 5px;
    border-radius: 3px;
    background: #FFFFFF;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 8px;
  }
  p {
    font-size: 15px;
    line-height: 1.5;
    color: #C4C4CC;
    max-width: 320px;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="contenedor">
    <div class="logo">
      <div class="barra" style="height: 14px;"></div>
      <div class="barra" style="height: 22px;"></div>
      <div class="barra" style="height: 32px;"></div>
      <div class="barra" style="height: 22px;"></div>
      <div class="barra" style="height: 14px;"></div>
    </div>
    <h1>Unísono</h1>
    <p>Tu repertorio. Tu equipo. Siempre sincronizados.</p>
  </div>
</body>
</html>
