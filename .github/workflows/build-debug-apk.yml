name: Build debug APK

# Compila el APK debug en un runner de GitHub, sin depender del entorno
# local — usado mientras el JDK/Gradle local está bloqueado por un
# driver de red (ver commits recientes). Se puede disparar a mano desde
# la pestaña Actions o con cada push a main.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable

      # firebase_options.dart está en .gitignore (config del proyecto
      # Firebase, no un secreto tradicional, pero mejor no publicarlo en
      # un repo público) — se reconstruye acá desde un Secret del repo.
      - name: Escribir firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_PARA_SECRET }}
        run: printf '%s' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart

      # Mismo caso que firebase_options.dart, pero para el build nativo de
      # Android: el plugin de Google Services necesita este archivo.
      - name: Escribir google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
