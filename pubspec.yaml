name: app_alabanzas
description: >
  Unísono — cuando varias voces suenan como una sola. App offline-first
  para equipos de alabanza: letra, acordes y tonalidades sincronizados en
  tiempo real entre celulares, con o sin conexión a internet.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend / persistencia — Capa 1 (Contenido). cloud_firestore trae
  # caché offline nativa, así que no hace falta una base de datos local
  # aparte para ritmos/artistas/canciones/actividades.
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1

  # Foto de perfil: sube el archivo elegido a Storage y guarda solo la URL
  # en el documento del Miembro (Firestore no es para archivos binarios).
  firebase_storage: ^12.3.2

  # Tipografía del sistema de diseño (Nocturne): Inter para todo el texto.
  google_fonts: ^6.2.1

  # Estado compartido entre features (repositorios, estado de sync en vivo).
  # Se eligió Provider sobre Riverpod por simplicidad: el equipo que va a
  # mantener este proyecto es un grupo de voluntarios, no un equipo de
  # dev full-time, y Provider tiene menos conceptos nuevos que aprender.
  provider: ^6.1.2

  # Igualdad de valor (==, hashCode) en los modelos sin escribir boilerplate.
  equatable: ^2.0.5

  # Formateo de fechas para Actividades (ej. "domingo 6 de septiembre").
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

  # Capa 2 — sync en vivo sin internet (Paso 4). Fork mantenido del
  # flutter_nearby_connections original: una sola interfaz Dart sobre
  # Nearby Connections API (Android) y Multipeer Connectivity (iOS).
  flutter_nearby_connections_plus: ^1.2.2

  # Pide los permisos de Bluetooth/ubicación en tiempo de ejecución que
  # Nearby Connections necesita en Android 6+ (y los granulares de
  # Android 12+: BLUETOOTH_SCAN/ADVERTISE/CONNECT).
  permission_handler: ^11.3.1

  # Captura el enlace de invitación (App Link) cuando el líder invita a
  # alguien — ver InviteLinkService y AndroidManifest.xml.
  app_links: ^7.2.1

  # Preferencia de apariencia (tema, tamaño de letra, mostrar acordes) —
  # ver AparienciaScreen. Es local al celular a propósito, no vive en
  # Firestore: es una preferencia de lectura, no un dato del equipo.
  shared_preferences: ^2.3.2

  # Elegir/sacar la foto de perfil desde la galería o la cámara.
  image_picker: ^1.1.2

  # Pantalla completa encendida durante Vista en vivo — ver
  # "Mantener pantalla encendida" en AparienciaScreen.
  wakelock_plus: ^1.2.8

  # Notificaciones push — ver NotificacionesService. Quién las manda de
  # verdad son las Cloud Functions (carpeta functions/), esto solo recibe
  # el token del dispositivo y muestra el aviso.
  firebase_messaging: ^15.1.3

  # Mostrar el aviso mientras la app está abierta — FCM por sí solo solo
  # pinta la notificación del sistema cuando la app está en segundo
  # plano o cerrada, no en primer plano.
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Ícono de la app: mismo logo de ondas que ya se usa en la pantalla de
# bienvenida (ver _LogoUnisono en splash_screen.dart) — fondo violeta de
# marca (#6C63FF) con las 5 barras en blanco. `icon_foreground.png` es
# solo las barras sobre fondo transparente, para el ícono adaptativo de
# Android (que recorta el fondo según la forma del launcher del usuario).
# Correr `dart run flutter_launcher_icons` después de cambiar cualquiera
# de los dos archivos.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#6C63FF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

# El build.gradle publicado de flutter_nearby_connections_plus 1.2.2 usa
# jcenter() (cerrado por Google en 2022) y un Android Gradle Plugin de
# 2019 — no compila con las herramientas actuales. `packages/` tiene una
# copia local con SOLO ese archivo parcheado (mismo código Dart/Kotlin, ver
# packages/flutter_nearby_connections_plus/android/build.gradle). Esto se
# puede sacar el día que el paquete original se actualice en pub.dev.
dependency_overrides:
  flutter_nearby_connections_plus:
    path: packages/flutter_nearby_connections_plus
